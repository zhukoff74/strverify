[package]
name = "strverify"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Composable string content filters implemented in Rust"
readme = "README.md"
license = "MIT"
keywords = ["string", "filter", "validation", "unicode", "pyo3"]
categories = ["text-processing"]

[lib]
name = "_strverify"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
unicode-general-category = "1.1.0"
unicode-script = "0.5.9"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
codegen-units = 1
lto = "thin"
